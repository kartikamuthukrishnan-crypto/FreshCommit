<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#061F17" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing Seedling / Git Commit Icon Container -->
  <g transform="translate(100, 140)">
    <rect width="110" height="110" rx="28" fill="#0F172A" stroke="#10B981" stroke-width="3" filter="url(#glow)" />
    <!-- Git Branch Line -->
    <path d="M34 22v66" stroke="#475569" stroke-width="7" stroke-linecap="round" />
    <!-- Commit Branch Curve -->
    <path d="M34 66c0-18 22-26 40-26" stroke="#10B981" stroke-width="7" stroke-linecap="round" />
    <!-- Lower Commit Node -->
    <circle cx="34" cy="76" r="10" fill="#0F172A" stroke="#94A3B8" stroke-width="4.5" />
    <!-- Active Green Node -->
    <circle cx="74" cy="40" r="12" fill="#064E3B" stroke="#34D399" stroke-width="5" />
    <!-- Sprout Leaf -->
    <path d="M74 30c2-10 18-10 18-10s0 16-10 18c-4 1-8-3-8-8z" fill="#10B981" />
  </g>

  <!-- Brand Typography -->
  <text x="240" y="215" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1.5">
    Fresh<tspan fill="#10B981">Commits</tspan><tspan font-size="34" fill="#64748B" font-weight="600">.com</tspan>
  </text>

  <!-- Badge: 0-2 YoE Verified -->
  <g transform="translate(240, 245)">
    <rect width="210" height="42" rx="21" fill="#064E3B" stroke="#059669" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#34D399" />
    <text x="40" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#A7F3D0" letter-spacing="0.5">
      0–2 YoE SWE ONLY
    </text>
  </g>

  <!-- Tagline Headline -->
  <text x="100" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#F8FAFC" letter-spacing="-0.5">
    Entry-Level &amp; New Grad Software Engineering Jobs
  </text>

  <!-- Subtitle Description -->
  <text x="100" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
    Curated junior roles across top tech hubs &amp; remote. Verified ATS links, direct applications,
  </text>
  <text x="100" y="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
    zero senior bloat, authentic salary indices, and validated Google JobPosting structured data.
  </text>

  <!-- Bottom Pills: Tech Categories -->
  <g transform="translate(100, 530)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="38" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="80" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">Full Stack</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="160" height="38" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="255" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">Backend / APIs</text>

    <!-- Pill 3 -->
    <rect x="350" y="0" width="160" height="38" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="430" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">Frontend / React</text>

    <!-- Pill 4 -->
    <rect x="525" y="0" width="170" height="38" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="610" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">DevOps &amp; Cloud</text>

    <!-- Pill 5 -->
    <rect x="710" y="0" width="180" height="38" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="800" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">Data &amp; AI Engineering</text>
  </g>
</svg>
