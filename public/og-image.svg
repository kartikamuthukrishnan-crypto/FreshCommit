<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#051811" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D78E" />
      <stop offset="50%" stop-color="#D8B23C" />
      <stop offset="100%" stop-color="#E9C55E" />
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B5B84" />
      <stop offset="100%" stop-color="#142B45" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D7647" />
      <stop offset="50%" stop-color="#3D925A" />
      <stop offset="100%" stop-color="#6BC589" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Official FreshCommits Logo Container -->
  <g transform="translate(100, 130)">
    <rect width="118" height="118" rx="28" fill="#0B1324" stroke="#D8B23C" stroke-width="2" filter="url(#glow)" />
    <!-- Nested Emblem scaled to 118x118 -->
    <g transform="translate(16, 16) scale(0.17)">
      <!-- Left Bracket Diamond -->
      <path
        d="M176 122 L62 264 C58 269 58 277 62 282 L194 448 C198 453 206 454 211 449 L217 443 C221 438 220 430 215 425 L108 274 L196 142 C200 137 199 129 194 125 L187 120 C183 118 179 119 176 122 Z"
        fill="url(#bracketGrad)"
        stroke="url(#goldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <!-- Stem -->
      <path
        d="M198 472 C198 472 205 385 228 290 C242 232 250 180 248 135 C242 185 224 240 200 310 C186 352 178 418 198 472 Z"
        fill="url(#leafGrad)"
        stroke="url(#goldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <!-- Top Leaf -->
      <path
        d="M246 138 C238 88 210 40 186 26 C176 96 182 178 238 236 C248 196 250 162 246 138 Z"
        fill="url(#leafGrad)"
        stroke="url(#goldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <path
        d="M186 26 C226 40 278 88 288 184 C256 188 244 162 246 138 C250 102 230 52 186 26 Z"
        fill="url(#leafGrad)"
        stroke="url(#goldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <!-- Lateral Leaf -->
      <path
        d="M364 218 C318 200 274 212 252 236 C272 284 322 320 428 304 C440 262 422 232 364 218 Z"
        fill="url(#leafGrad)"
        stroke="url(#goldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="245" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="-1.5">
    Fresh<tspan fill="#10B981">Commits</tspan><tspan font-size="34" fill="#E2E8F0" font-weight="700">.com</tspan>
  </text>

  <!-- Badge: 0-2 YoE & Internships Verified -->
  <g transform="translate(245, 235)">
    <rect width="250" height="38" rx="19" fill="#0B2E1E" stroke="#10B981" stroke-width="1.5" />
    <circle cx="20" cy="19" r="4.5" fill="#34D399" />
    <text x="34" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#A7F3D0" letter-spacing="0.5">
      0–2 YoE &amp; INTERNSHIPS ONLY
    </text>
  </g>

  <!-- Tagline Headline -->
  <text x="100" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#F8FAFC" letter-spacing="-0.5">
    Entry-Level, New Grad &amp; Paid Tech Internships
  </text>

  <!-- Subtitle Description -->
  <text x="100" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
    Curated software engineering roles across top US tech hubs &amp; remote. Verified direct ATS links,
  </text>
  <text x="100" y="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
    zero senior bloat, authentic salary indices, and validated Google JobPosting structured data.
  </text>

  <!-- Footer Stats Bar -->
  <g transform="translate(100, 530)">
    <rect width="1000" height="52" rx="12" fill="#1E293B" opacity="0.6" />
    
    <!-- Metric 1 -->
    <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#34D399">
      100% Direct ATS Links
    </text>
    <text x="230" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B">&bull;</text>

    <!-- Metric 2 -->
    <text x="260" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">
      0-2 Years Experience Strict
    </text>
    <text x="530" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B">&bull;</text>

    <!-- Metric 3 -->
    <text x="560" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FBBF24">
      $115k–$145k Avg Base
    </text>
    <text x="775" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B">&bull;</text>

    <!-- Metric 4 -->
    <text x="805" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#A7F3D0">
      Verified Summer Internships
    </text>
  </g>
</svg>
