name: Automated 6-Hour ATS Job Sync

on:
  schedule:
    # Run every 6 hours at minute 17 to avoid top-of-hour API throttling
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run ATS sync without writing to Firestore or committing changes'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: freshcommits-ats-sync
  cancel-in-progress: false

jobs:
  sync-ats-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Reset transient indexing delta queue
        run: rm -f .sync-indexing-queue.json

      - name: Run 6-Hour ATS Job Sync & Lifecycle Check
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_NEW_JOBS_PER_RUN: '25'
          MAX_PER_COMPANY: '3'
          MAX_AGE_DAYS: '45'
        run: node scripts/sync-ats-jobs.mjs

      - name: Verify Employer Apply Links & Prune Dead/Expired Jobs
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/verify-job-links.mjs

      - name: Refresh public/data/jobs.json and public/sitemap.xml
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: node scripts/pull-firestore-jobs.mjs

      - name: Generate Open-Source GitHub Jobs Table & Weekly Community Drops
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: node scripts/generate-community-exports.mjs

      - name: Notify Google Indexing API (URL_UPDATED & URL_DELETED)
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
          MAX_INDEXING_PER_RUN: '100'
        run: node scripts/notify-google-indexing.mjs

      - name: Commit and push updated feed, sitemap & community exports
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          if [ -z "$(git status --porcelain public/data/jobs.json public/sitemap.xml community/GITHUB_JOBS_README.md community/WEEKLY_DROP.md)" ]; then
            echo "No changes to feed, sitemap, or community exports."
            exit 0
          fi
          git config user.name "freshcommits-sync-bot"
          git config user.email "sync-bot@freshcommits.com"
          git add public/data/jobs.json public/sitemap.xml community/GITHUB_JOBS_README.md community/WEEKLY_DROP.md
          git commit -m "chore(sync): 6-hour ATS job feed, sitemap & community exports [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push

      - name: Mirror Open-Source Jobs Table to Public GitHub Repo (Optional)
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        env:
          PUBLIC_JOBS_REPO: ${{ secrets.PUBLIC_JOBS_REPO }}
          PUBLIC_JOBS_REPO_TOKEN: ${{ secrets.PUBLIC_JOBS_REPO_TOKEN }}
        run: |
          if [ -z "${PUBLIC_JOBS_REPO}" ] || [ -z "${PUBLIC_JOBS_REPO_TOKEN}" ]; then
            echo "PUBLIC_JOBS_REPO or PUBLIC_JOBS_REPO_TOKEN not configured — skipping public repo mirror."
            exit 0
          fi
          rm -rf /tmp/public-jobs-repo
          git clone "https://x-access-token:${PUBLIC_JOBS_REPO_TOKEN}@github.com/${PUBLIC_JOBS_REPO}.git" /tmp/public-jobs-repo
          cp community/GITHUB_JOBS_README.md /tmp/public-jobs-repo/README.md
          git -C /tmp/public-jobs-repo config user.name "freshcommits-sync-bot"
          git -C /tmp/public-jobs-repo config user.email "sync-bot@freshcommits.com"
          if [ -z "$(git -C /tmp/public-jobs-repo status --porcelain README.md)" ]; then
            echo "Public jobs repo README.md is already up to date."
            exit 0
          fi
          git -C /tmp/public-jobs-repo add README.md
          git -C /tmp/public-jobs-repo commit -m "chore: refresh verified US 0-2 YoE SWE jobs & 2027 internships"
          git -C /tmp/public-jobs-repo push
