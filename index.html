                  "addressLocality": job.city || (job.location ? job.location.split(',')[0].trim() : "San Francisco"),
                  "addressRegion": job.state || (job.location ? job.location.split(',')[1]?.trim() : "CA"),
                  "addressCountry": cleanCountry,
                  "postalCode": job.postalCode || undefined
                }
              };
            }

            // Strict singleton assignment: prevent duplicate JobPosting schema injection
            function applySchema() {
              try {
                var defaultSchema = document.getElementById('default-website-schema');
                if (defaultSchema) defaultSchema.remove();
              } catch (_) {}
              var existing = document.getElementById('google-job-posting-schema');
              if (existing) {
                // If it already has valid JobPosting content, leave it intact
                if (existing.textContent && existing.textContent.indexOf('"JobPosting"') !== -1) {
                  return;
                }
                existing.textContent = JSON.stringify(s, null, 2);
              } else {
                var allLd = document.querySelectorAll('script[type="application/ld+json"]');
                for (var sIdx = 0; sIdx < allLd.length; sIdx++) {
                  if (allLd[sIdx].textContent && allLd[sIdx].textContent.indexOf('"JobPosting"') !== -1) {
                    allLd[sIdx].id = 'google-job-posting-schema';
                    return;
                  }
                }
                var scriptEl = document.createElement('script');
                scriptEl.type = 'application/ld+json';
                scriptEl.id = 'google-job-posting-schema';
                scriptEl.textContent = JSON.stringify(s, null, 2);
                document.head.appendChild(scriptEl);
              }
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', applySchema);
            } else {
              applySchema();
            }

            var hasLongTail = /(?:entry[\s-]level|0[\s-]2|junior|new\s*grad|intern|graduate|fresher)/i.test(job.title);
            var expTag = hasLongTail ? '' : ' (0–2 YoE / Entry Level)';
            document.title = job.title + expTag + ' at ' + job.company + ' – Direct ATS Apply | FreshCommits';
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
              metaDesc.content = 'Apply directly for ' + job.title + ' at ' + job.company + ' in ' + (job.location || 'Remote') + '. Verified 0–2 YoE software engineer opening with direct ATS link (no ghost jobs). Free ATS resume match checker.';
            }
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.content = job.title + expTag + ' at ' + job.company + ' – FreshCommits';
            var ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.content = 'Direct entry-level software engineering requisition at ' + job.company + ' (0–2 YoE). No ghost jobs.';
            var canLink = document.querySelector('link[rel="canonical"]');
            if (canLink) canLink.href = 'https://www.freshcommits.com/job/' + encodeURIComponent(job.id || jobId);

            window.__PRELOADED_JOB__ = job;
            try {
              window.dispatchEvent(new CustomEvent('freshcommits_job_preloaded', { detail: job }));
            } catch (e) {}

            // Populate semantic crawlable DOM fallback for headless search engines
            try {
              var mainEl = document.querySelector('main');
              if (mainEl && !document.getElementById('crawled-job-view')) {
                var art = document.createElement('article');
                art.id = 'crawled-job-view';
                art.style.background = '#ffffff';
                art.style.border = '2px solid #10b981';
                art.style.borderRadius = '16px';
                art.style.padding = '24px';
                art.style.marginBottom = '32px';
                art.innerHTML = '<span style=\"color:#059669;font-weight:700;font-size:12px;\">✓ DIRECT EMPLOYER APPLICATION (0–2 YoE)</span>' +
                  '<h2 style=\"font-size:26px;font-weight:800;color:#0f172a;margin:8px 0;\">' + escapeHtml(job.title) + ' at ' + escapeHtml(job.company) + '</h2>' +
                  '<div style=\"color:#64748b;font-size:14px;margin-bottom:16px;\">📍 ' + escapeHtml(job.location || 'Remote') + ' &nbsp;•&nbsp; 💼 ' + escapeHtml(job.experienceLevel || 'Entry Level') + ' &nbsp;•&nbsp; 🗓️ Posted ' + escapeHtml(job.datePosted || 'Recently') + '</div>' +
                  formatDescription(job) +
                  '<div style=\"margin-top:20px;\"><a href=\"' + escapeHtml(job.applyUrl || '#') + '\" style=\"display:inline-block;background:#4f46e5;color:#ffffff;padding:10px 20px;border-radius:8px;font-weight:700;text-decoration:none;\">Apply on Company Site →</a></div>';
                mainEl.prepend(art);
              }
            } catch (e) {}
          }

          // Step 1: Immediate synchronous check from embedded registry (zero crawler latency)
          if (SYNCHRONOUS_JOBS[jobId]) {
            if (SYNCHRONOUS_JOBS[jobId].status === 'EXPIRED') {
              var rMeta = document.querySelector('meta[name="robots"]');
              if (rMeta) rMeta.setAttribute('content', 'noindex, follow');
              return;
            }
            injectSchema(SYNCHRONOUS_JOBS[jobId]);
            return;
          }

          function parseFirestoreVal(v) {
            if (!v) return undefined;
            if ('stringValue' in v) return v.stringValue;
            if ('booleanValue' in v) return v.booleanValue;
            if ('integerValue' in v) return parseInt(v.integerValue, 10);
            if ('doubleValue' in v) return parseFloat(v.doubleValue);
            if ('arrayValue' in v) {
              var vals = v.arrayValue.values || [];
              var arr = [];
              for (var i = 0; i < vals.length; i++) arr.push(parseFirestoreVal(vals[i]));
              return arr;
            }
            if ('mapValue' in v) {
              var fields = v.mapValue.fields || {};
              var obj = {};
              for (var k in fields) obj[k] = parseFirestoreVal(fields[k]);
              return obj;
            }
            return undefined;
          }

          // Step 2: Try local browser cache
          var raw = null;
          try {
            raw = localStorage.getItem('freshcommit_jobs_v5') || localStorage.getItem('freshcommit_jobs_v4') || localStorage.getItem('freshcommit_jobs_v3');
          } catch (e) {}
          if (raw) {
            try {
              var list = JSON.parse(raw);
              if (Array.isArray(list)) {
                for (var i = 0; i < list.length; i++) {
                  if (list[i].id && list[i].id.toLowerCase() === jobId.toLowerCase()) {
                    injectSchema(list[i]);
                    return;
                  }
                }
              }
            } catch (e) {}
          }

          // Step 3: Fetch static /data/jobs.json cache first, then fall back to Firestore REST API
          function fetchFromFirestoreFallback() {
            var restUrl = 'https://firestore.googleapis.com/v1/projects/centered-module-9smzh/databases/ai-studio-juniordevhubentr-9fce9c23-e540-412e-ae3f-aca1eaf015f5/documents/jobs/' + encodeURIComponent(jobId);
            fetch(restUrl)
              .then(function(res) {
                if (!res.ok) throw new Error('Status ' + res.status);
                return res.json();
              })
              .then(function(doc) {
                if (doc && doc.fields) {
                  var jobObj = {};
                  for (var f in doc.fields) {
                    jobObj[f] = parseFirestoreVal(doc.fields[f]);
                  }
                  jobObj.id = jobObj.id || jobId;
                  injectSchema(jobObj);
                  try {
                    sessionStorage.setItem('job_' + jobObj.id, JSON.stringify(jobObj));
                    sessionStorage.setItem('freshcommit_last_job', JSON.stringify(jobObj));
                  } catch (e) {}
                }
              })
              .catch(function(err) {
                console.warn('Crawler job preload note:', err);
              });
          }

          fetch('/data/jobs.json')
            .then(function(res) {
              if (!res.ok) throw new Error('No static cache');
              return res.json();
            })
            .then(function(list) {
              if (Array.isArray(list)) {
                for (var idx = 0; idx < list.length; idx++) {
                  if (list[idx] && list[idx].id && list[idx].id.toLowerCase() === jobId.toLowerCase()) {
                    injectSchema(list[idx]);
                    try {
                      sessionStorage.setItem('job_' + list[idx].id, JSON.stringify(list[idx]));
                      sessionStorage.setItem('freshcommit_last_job', JSON.stringify(list[idx]));
                    } catch (e) {}
                    return;
                  }
                }
              }
              fetchFromFirestoreFallback();
            })
            .catch(function() {
              fetchFromFirestoreFallback();
            });
        } catch (e) {}
      })();
    </script>
