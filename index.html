    <!-- Google tag (gtag.js) - Automatically Excludes Admin Traffic -->
    <script>
      (function() {
        var GA_ID = 'G-YQMXK76Q2H';
        var isAdmin = false;
        try {
          var search = (window.location.search || '').toLowerCase();
          var hash = (window.location.hash || '').toLowerCase();
          var isAdminAuth = localStorage.getItem('freshcommit_admin_auth') === 'true' ||
                            sessionStorage.getItem('freshcommit_admin_auth') === 'true' ||
                            localStorage.getItem('freshcommits_exclude_analytics') === 'true';

          if (
            search.indexOf('view=admin') !== -1 ||
            search.indexOf('admin=true') !== -1 ||
            search.indexOf('admin=1') !== -1 ||
            hash.indexOf('admin') !== -1 ||
            isAdminAuth
          ) {
            isAdmin = true;
          }
        } catch (e) {
          // ignore
        }

        if (isAdmin) {
          // Explicitly disable Google Analytics tracking for Admin traffic
          window['ga-disable-' + GA_ID] = true;
          window['__GA_EXCLUDED_ADMIN__'] = true;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function() {}; // No-op
        } else {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', GA_ID, {
            send_page_view: true,
            anonymize_ip: true
          });
        }
      })();
    </script>

          // 1. Check pathname: /job/:id or /jobs/:id (Canonical URL format)
          var pathname = window.location.pathname || '';
          var pathMatch = pathname.match(/^\/(?:jobs|job)\/([^/?#]+)/i);
          if (pathMatch && pathMatch[1]) {
            jobId = decodeURIComponent(pathMatch[1]);
          }

          if (!jobId) {
            var params = new URLSearchParams(window.location.search);
            jobId = params.get('job') || params.get('jobId');
          }

          // 3. Check hash: #job=:id or #job-:id
          if (!jobId && window.location.hash) {
            var hash = window.location.hash.replace('#', '');
            if (hash.indexOf('job=') === 0) jobId = hash.replace('job=', '');
            else if (hash.indexOf('job-') === 0) jobId = hash;

          if (!jobId) return;

          // Country mapping for Google Search Central JobPosting schema

          function escapeHtml(str) {
            if (!str) return '';
            return String(str)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#039;');
          }

          function formatDescription(job) {
            var rawDesc = job.description || ('Apply directly for ' + job.title + ' at ' + job.company);
            var paragraphs = String(rawDesc)
              .split(/\n\s*\n/)
              .map(function(p) { return p.trim(); })
              .filter(Boolean);
            
            var html = '';
            for (var pIdx = 0; pIdx < paragraphs.length; pIdx++) {
              html += '<p>' + escapeHtml(paragraphs[pIdx]).replace(/\n/g, '<br />') + '</p>';
            }
            if (!html) html = '<p>' + escapeHtml(rawDesc) + '</p>';

            if (job.responsibilities && job.responsibilities.length) {
              html += '<p><strong>Key Responsibilities:</strong></p><ul>';
              for (var i = 0; i < job.responsibilities.length; i++) {
                html += '<li>' + escapeHtml(job.responsibilities[i]) + '</li>';
              }
              html += '</ul>';
            }
            if (job.qualifications && job.qualifications.length) {
              html += '<p><strong>Qualifications (0–2 YoE):</strong></p><ul>';
              for (var j = 0; j < job.qualifications.length; j++) {
                html += '<li>' + escapeHtml(job.qualifications[j]) + '</li>';
              }
              html += '</ul>';
            }
            if (job.skills && job.skills.length) {
              html += '<p><strong>Required Tech Stack:</strong> ' + job.skills.map(escapeHtml).join(', ') + '</p>';
            }
            return html;
          }

          function injectSchema(job) {
            if (!job || !job.title || !job.company) return;
            var countryCode = (job.applicantLocationRequirements || job.country || 'US').trim().toUpperCase();
            var countryName = COUNTRY_MAP[countryCode] || countryCode;

            var s = {
              "@context": "https://schema.org",
              "@type": "JobPosting",
              "title": job.title,
              "description": formatDescription(job),
              "identifier": {
                "@type": "PropertyValue",
                "name": job.company,
                "value": job.id || jobId
              },
              "datePosted": job.datePosted || new Date().toISOString().split('T')[0],
              "validThrough": job.validThrough || "2026-12-31",
              "employmentType": job.employmentType || "FULL_TIME",
              "directApply": true,
              "hiringOrganization": {
                "@type": "Organization",
                "name": job.company,
                "sameAs": job.companyWebsite || undefined,
                "logo": job.companyLogo || undefined
              },
              "experienceRequirements": {
                "@type": "OccupationalExperienceRequirements",
                "monthsOfExperience": (job.maxYearsExperience || 1) * 12
              }
            };
            s.url = 'https://www.freshcommits.com/job/' + encodeURIComponent(job.id || jobId);
            if (job.applyUrl) s.sameAs = job.applyUrl;
            if (job.salary && job.salary.min > 0) {
              s.baseSalary = {
                "@type": "MonetaryAmount",
                "currency": job.salary.currency || "USD",
                "value": {
                  "@type": "QuantitativeValue",
                  "minValue": job.salary.min,
                  "maxValue": job.salary.max || job.salary.min,
                  "unitText": job.salary.unit || "YEAR"
                }
              };
            }
            if (job.isRemote) {
              s.jobLocationType = "TELECOMMUTE";
              s.applicantLocationRequirements = {
                "@type": "Country",
                "name": countryName
              };
              var locality = job.city || (job.location && !job.location.toLowerCase().includes('remote') ? job.location.split(',')[0].trim() : (countryCode === 'GB' ? 'Belfast' : 'San Francisco'));
              var region = job.state || (job.location && !job.location.toLowerCase().includes('remote') ? job.location.split(',')[1]?.trim() : (countryCode === 'GB' ? 'Northern Ireland' : 'CA'));
              s.jobLocation = {
                "@type": "Place",
                "address": {
                  "@type": "PostalAddress",
                  "addressLocality": locality,
                  "addressRegion": region,
                  "addressCountry": countryCode === 'GB' ? 'GB' : (job.country || 'US'),
                  "postalCode": job.postalCode || undefined
                }
              };
            } else {
              s.jobLocation = {
                "@type": "Place",
                "address": {
                  "@type": "PostalAddress",
                  "addressLocality": job.city || (job.location ? job.location.split(',')[0].trim() : "San Francisco"),
                  "addressRegion": job.state || (job.location ? job.location.split(',')[1]?.trim() : "CA"),
                  "addressCountry": job.country || "US",
                  "postalCode": job.postalCode || undefined
                }
              };
            }

            var existing = document.getElementById('google-job-posting-schema');
            if (existing) {
              existing.textContent = JSON.stringify(s, null, 2);
            } else {
              var scriptEl = document.createElement('script');
              scriptEl.type = 'application/ld+json';
              scriptEl.id = 'google-job-posting-schema';
              scriptEl.textContent = JSON.stringify(s, null, 2);
              document.head.appendChild(scriptEl);
            }

            document.title = job.title + ' at ' + job.company + ' (0-2 YoE) – FreshCommits';
            var metaDesc = document.querySelector('meta[name="description"]');

              metaDesc.content = 'Apply directly for ' + job.title + ' at ' + job.company + ' in ' + (job.location || 'Remote') + '. Verified early-career software engineering opportunity with direct company application.';
            }
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.content = job.title + ' at ' + job.company + ' – FreshCommits';
            var ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.content = 'Direct entry-level software engineering requisition at ' + job.company + '. 0–2 YoE.';

            window.__PRELOADED_JOB__ = job;
            try {
              window.dispatchEvent(new CustomEvent('freshcommits_job_preloaded', { detail: job }));
            } catch (e) {}

            // Populate semantic crawlable DOM fallback for headless search engines
            try {
              var mainEl = document.querySelector('main');
              if (mainEl && !document.getElementById('crawled-job-view')) {
                var art = document.createElement('article');

                  '<div style=\"color:#64748b;font-size:14px;margin-bottom:16px;\">📍 ' + escapeHtml(job.location || 'Remote') + ' &nbsp;•&nbsp; 💼 ' + escapeHtml(job.experienceLevel || 'Entry Level') + ' &nbsp;•&nbsp; 🗓️ Posted ' + escapeHtml(job.datePosted || 'Recently') + '</div>' +
                  formatDescription(job) +
                  '<div style=\"margin-top:20px;\"><a href=\"' + escapeHtml(job.applyUrl || '#') + '\" style=\"display:inline-block;background:#4f46e5;color:#ffffff;padding:10px 20px;border-radius:8px;font-weight:700;text-decoration:none;\">Apply on Company Site →</a></div>';
                mainEl.prepend(art);
              }
            } catch (e) {}
          }

          // Step 1: Immediate synchronous check from embedded registry (zero crawler latency)
          if (SYNCHRONOUS_JOBS[jobId]) {
            injectSchema(SYNCHRONOUS_JOBS[jobId]);
            return;
          }

          function parseFirestoreVal(v) {
            if (!v) return undefined;
            if ('stringValue' in v) return v.stringValue;
            if ('booleanValue' in v) return v.booleanValue;
            if ('integerValue' in v) return parseInt(v.integerValue, 10);
            if ('doubleValue' in v) return parseFloat(v.doubleValue);
            if ('arrayValue' in v) {
              var vals = v.arrayValue.values || [];
              var arr = [];
              for (var i = 0; i < vals.length; i++) arr.push(parseFirestoreVal(vals[i]));
              return arr;
            }
            if ('mapValue' in v) {
              var fields = v.mapValue.fields || {};
              var obj = {};
              for (var k in fields) obj[k] = parseFirestoreVal(fields[k]);
              return obj;
            }
            return undefined;
          }

          // Step 2: Try local browser cache
          var raw = localStorage.getItem('freshcommit_jobs_v5') || localStorage.getItem('freshcommit_jobs_v4') || localStorage.getItem('freshcommit_jobs_v3');
          if (raw) {
            try {
              var list = JSON.parse(raw);
              if (Array.isArray(list)) {
                for (var i = 0; i < list.length; i++) {
                  if (list[i].id && list[i].id.toLowerCase() === jobId.toLowerCase()) {
                    injectSchema(list[i]);
                    return;
                  }
                }
              }
            } catch (e) {}
          }

          // Step 3: Fetch directly from Firestore public REST API as fallback
          var restUrl = 'https://firestore.googleapis.com/v1/projects/centered-module-9smzh/databases/ai-studio-juniordevhubentr-9fce9c23-e540-412e-ae3f-aca1eaf015f5/documents/jobs/' + encodeURIComponent(jobId);
          fetch(restUrl)
            .then(function(res) {
              if (!res.ok) throw new Error('Status ' + res.status);
              return res.json();
            })
            .then(function(doc) {
              if (doc && doc.fields) {
                var jobObj = {};
                for (var f in doc.fields) {
                  jobObj[f] = parseFirestoreVal(doc.fields[f]);
                }
                jobObj.id = jobObj.id || jobId;
                injectSchema(jobObj);
                try {
                  var saved = localStorage.getItem('freshcommit_jobs_v5');
                  var parsedJobs = saved ? JSON.parse(saved) : [];
                  if (Array.isArray(parsedJobs)) {
                    if (!parsedJobs.some(function(j) { return j.id === jobObj.id; })) {
                      parsedJobs.unshift(jobObj);
                      localStorage.setItem('freshcommit_jobs_v5', JSON.stringify(parsedJobs));
                    }
                  }
                } catch (e) {}
              }
            })
            .catch(function(err) {
              console.warn('Crawler job preload note:', err);
            });
        } catch (e) {}
      })();
    </script>
